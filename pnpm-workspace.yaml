packages:
  - "apps/*"
  - "packages/*"

# Every dependency version lives here. Reference with "catalog:<name>" in a
# package.json; never write a literal version (CLAUDE.md). Add an `fe` catalog
# when the first frontend workspace needs it.
catalogs:
  
  be:
    "@nestjs/bullmq": ^12.0.0
    "@nestjs/cli": ^12.0.10
    "@nestjs/common": ^12.2.0
    "@nestjs/core": ^12.2.0
    "@nestjs/platform-express": ^12.2.0
    "@nestjs/testing": ^12.2.0
    "@nestjs/throttler": ^6.7.1
    "@node-rs/argon2": ^2.2.2
    "@swc/core": ^1.16.0
    "@testcontainers/postgresql": ^12.2.1
    "@testcontainers/redis": ^12.2.1
    "@types/cookie-parser": ^1.4.10
    "@types/express": ^5.0.6
    "@types/nodemailer": ^8.0.2
    "@types/pg": ^8.23.1
    "@types/supertest": ^7.2.1
    bullmq: ^6.4.2
    cookie-parser: ^1.4.7
    drizzle-kit: ^0.31.11
    ioredis: ^6.0.0
    drizzle-orm: ^0.45.4
    nestjs-pino: ^5.3.1
    nodemailer: ^10.2.1
    pg: ^8.23.1
    pino: ^10.4.0
    pino-http: ^11.0.0
    pino-pretty: ^13.2.0
    reflect-metadata: ^0.2.2
    rxjs: ^7.8.2
    supertest: ^7.3.1
    testcontainers: ^12.2.1
    unplugin-swc: ^2.0.0
  generic:
    "@commitlint/cli": ^21.2.0
    "@commitlint/config-conventional": ^21.2.0
    "@eslint/js": ^10.0.1
    "@ianvs/prettier-plugin-sort-imports": ^4.7.1
    "@types/node": ^24.0.0
    eslint: ^10.13.0
    globals: ^16.0.0
    husky: ^9.1.7
    prettier: ^3.9.0
    turbo: ^2.11.0
    typescript: ~5.9.3
    typescript-eslint: ^8.60.0
    uuid: ^14.0.3
    vite: ^8.3.0
    vitest: ^5.0.5
    zod: ^4.6.0

# Install scripts deliberately skipped: esbuild ships its binary as a platform
# package anyway; ssh2/cpu-features are optional native add-ons for Docker over
# SSH (unused); protobufjs only runs a version check.
ignoredBuiltDependencies:
  - cpu-features
  - esbuild
  - protobufjs
  - ssh2

# Never install a release younger than 14 days (in minutes). Most hijacked npm
# releases are caught and pulled within that window.
minimumReleaseAge: 20160

# Packages allowed to run install scripts (pnpm blocks all others).
onlyBuiltDependencies:
  - "@swc/core"
