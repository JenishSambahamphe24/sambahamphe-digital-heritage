# Install scripts deliberately skipped: esbuild and @parcel/watcher ship their
# binaries as platform packages anyway; ssh2/cpu-features are optional native
# add-ons for Docker over SSH (unused); protobufjs only runs a version check;
# @scarf/scarf is install telemetry.
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@scarf/scarf"
  - cpu-features
  - esbuild
  - protobufjs
  - ssh2

# Never install a release younger than 14 days (in minutes). Most hijacked npm
# releases are caught and pulled within that window.
minimumReleaseAge: 20160

# Packages allowed to run install scripts (pnpm blocks all others).
onlyBuiltDependencies:
  - "@swc/core"
