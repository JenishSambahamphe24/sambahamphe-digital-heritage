<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — modal</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/sambahampheui/tokens.css">
<link rel="stylesheet" href="ds/sambahampheui/components/bundle.css">
<script src="ds/sambahampheui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&amp;family=Noto+Serif:wght@600&amp;family=Noto+Sans+Devanagari:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2d3192}a:hover{color:#22256f}
.modal-faktanglung{background-color:#f7f7fc;background-image:linear-gradient(180deg,rgba(247,247,252,0) 0%,rgba(247,247,252,0.08) 16%,rgba(247,247,252,0.88) 28%,#f7f7fc 36%),url("/_blob/80254a1ec7a3e1f1307fb2d1e7827958");background-size:100% 100%,100% auto;background-position:top center,top center;background-repeat:no-repeat}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: var(--font-sans); color: var(--color-foreground); background: #1e2266">
  <img src="/_blob/e43ef7d099b4aae609414fa54186664b" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: right bottom">
  <div style="position: absolute; inset: 0; background: rgba(18, 19, 43, 0.62)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="modal-title" class="modal-faktanglung" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 460px; box-sizing: border-box; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 48px -12px rgb(0 0 0 / 0.45)">
    <a href="HomeDesktop.dc.html" aria-label="Close" style="position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: rgba(18, 19, 43, 0.45); color: #ffffff">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="height: 132px"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 0 32px 28px">
      <img src="/_blob/74d1d53640bbc4c25d8e208c90d53ca4" alt="Sambahamphe Utthan Sangh seal" style="width: 72px; height: 72px; object-fit: contain; background: #ffffff; border-radius: 9999px; padding: 6px; box-sizing: border-box; box-shadow: 0 4px 12px rgb(0 0 0 / 0.15); margin-top: -36px">
      <h2 id="modal-title" style="margin: 0; text-align: center; font-family: var(--font-display); font-size: 22px; line-height: 28px; font-weight: 600">{{heading}}</h2>
      <div role="tablist" aria-label="Account" style="align-self: stretch; display: flex; justify-content: center; gap: 32px; border-bottom: 1px solid var(--color-border)">
        <button type="button" role="tab" aria-selected="{{isLogin}}" onClick="{{showLogin}}" style="{{loginTabStyle}}">Sign in</button>
        <button type="button" role="tab" aria-selected="{{isSignup}}" onClick="{{showSignup}}" style="{{signupTabStyle}}">Create account</button>
      </div>

      <sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}">
        <form style="align-self: stretch; display: flex; flex-direction: column; gap: 4px">
          <div style="min-height: 92px">
            <x-import component-from-global-scope="SambahampheUI.FormField" id="mm-email" label="Email">
              <x-import component-from-global-scope="SambahampheUI.Input" id="mm-email" type="email" placeholder="you@example.com"></x-import>
            </x-import>
          </div>
          <div style="min-height: 92px">
            <x-import component-from-global-scope="SambahampheUI.FormField" id="mm-password" label="Password">
              <x-import component-from-global-scope="SambahampheUI.Input" id="mm-password" type="password"></x-import>
            </x-import>
          </div>
          <div style="display: flex; justify-content: flex-end; margin-top: -8px; margin-bottom: 12px">
            <a href="#" style="font-size: 14px; font-weight: 500">Forgot your password?</a>
          </div>
          <x-import component-from-global-scope="SambahampheUI.Button" type="button" class-name="w-full" on-click="{{signIn}}">Sign in</x-import>
        </form>
        <p style="margin: 0; text-align: center; font-size: 14px; color: var(--color-foreground-muted)">New here? <a href="#" onClick="{{showSignup}}" style="font-weight: 500">Create an account</a></p>
      </sc-if>

      <sc-if value="{{isSignup}}" hint-placeholder-val="{{ false }}">
        <form style="align-self: stretch; display: flex; flex-direction: column; gap: 4px">
          <div style="min-height: 92px">
            <x-import component-from-global-scope="SambahampheUI.FormField" id="mm-name" label="Your name">
              <x-import component-from-global-scope="SambahampheUI.Input" id="mm-name" type="text" autocomplete="name"></x-import>
            </x-import>
          </div>
          <div style="min-height: 92px">
            <x-import component-from-global-scope="SambahampheUI.FormField" id="mm-new-email" label="Email">
              <x-import component-from-global-scope="SambahampheUI.Input" id="mm-new-email" type="email" placeholder="you@example.com"></x-import>
            </x-import>
          </div>
          <div style="min-height: 92px">
            <x-import component-from-global-scope="SambahampheUI.FormField" id="mm-new-password" label="Password" hint="At least 12 characters.">
              <x-import component-from-global-scope="SambahampheUI.Input" id="mm-new-password" type="password"></x-import>
            </x-import>
          </div>
          <x-import component-from-global-scope="SambahampheUI.Button" type="button" class-name="w-full">Create account</x-import>
        </form>
        <p style="margin: 0; text-align: center; font-size: 14px; color: var(--color-foreground-muted)">Already have an account? <a href="#" onClick="{{showLogin}}" style="font-weight: 500">Sign in</a></p>
      </sc-if>
    </div>
  </div>
  <x-import component-from-global-scope="SambahampheUI.Toaster" close-label="Close"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'login' };
  }
  renderVals() {
    const base = 'margin: 0 0 -1px; padding: 0 4px 12px; background: none; border: 0; border-bottom: 2px solid transparent; font: inherit; font-size: 16px; cursor: pointer;';
    const active = base + ' border-bottom-color: var(--color-primary); color: var(--color-foreground); font-weight: 600;';
    const idle = base + ' color: var(--color-foreground-muted); font-weight: 500;';
    const isLogin = this.state.tab === 'login';
    return {
      isLogin,
      isSignup: !isLogin,
      heading: isLogin ? 'Welcome back' : 'Join the Sambahamphe archive',
      loginTabStyle: isLogin ? active : idle,
      signupTabStyle: isLogin ? idle : active,
      showLogin: (e) => { if (e) e.preventDefault(); this.setState({ tab: 'login' }); },
      showSignup: (e) => { if (e) e.preventDefault(); this.setState({ tab: 'signup' }); },
      // Play demo: a failed sign-in raises the danger toast.
      signIn: () => {
        const toasts = window.SambahampheUI && window.SambahampheUI.ToastHelper;
        if (toasts) toasts.show({ tone: 'danger', description: 'The email or password is incorrect.' });
      },
    };
  }
}
</script>
</body>
</html>
